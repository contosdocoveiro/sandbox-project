name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      skip: ${{ steps.labels.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C release-work origin/main

      - name: Read release label from merged PR
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t labels < <(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].labels[].name' 2>/dev/null || true)
          echo "Labels on merged PR: ${labels[*]:-none}"

          if printf '%s\n' "${labels[@]:-}" | grep -qx 'skip-release'; then
            echo "Skip-release label found; no version will be produced."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bump='patch'
          if printf '%s\n' "${labels[@]:-}" | grep -qx 'major'; then
            bump='major'
          elif printf '%s\n' "${labels[@]:-}" | grep -qx 'minor'; then
            bump='minor'
          fi

          echo 'skip=false' >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Compute version, commit and tag
        id: release
        if: ${{ steps.labels.outputs.skip != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version.txt must be MAJOR.MINOR.PATCH (got '$current')" >&2
            exit 1
          fi

          bump='${{ steps.labels.outputs.bump }}'
          if [[ -z "$(git tag --list 'v[0-9]*' | head -n1)" ]]; then
            # No release exists yet: publish the version already in the repo.
            next="$current"
          else
            IFS='.' read -r major minor patch <<< "$current"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"
          fi

          if [[ "$next" != "$current" ]]; then
            printf '%s\n' "$next" > version.txt
            if grep -q '^config/version=' project.godot; then
              sed -i -E "s|^config/version=.*|config/version=\"$next\"|" project.godot
            else
              sed -i "/^config\/name=/a config/version=\"$next\"" project.godot
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add version.txt project.godot
            git commit -m "chore(release): v$next [skip ci]"
          fi

          tag="v$next"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; refusing to move it." >&2
            exit 1
          fi

          git tag -a "$tag" -m "$tag"
          git push --atomic origin "HEAD:main" "refs/tags/$tag"

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Package Windows build
    needs: version
    if: ${{ needs.version.outputs.skip != 'true' && needs.version.outputs.tag != '' }}
    runs-on: windows-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Import project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:GODOT_BIN --headless --path . --import *> import.log
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Get-Content import.log
          if ($code -ne 0) { throw "Godot import failed with exit code $code" }
          $scriptErrors = Select-String -Path import.log -Pattern 'SCRIPT ERROR: Parse Error|Failed to load script'
          if ($scriptErrors) { throw "Script errors during import:`n$($scriptErrors | Out-String)" }

      - name: Export Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          & $env:GODOT_BIN --headless --path . --export-release "Windows Desktop" "build/windows/teste.exe" *> export.log
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Get-Content export.log
          if ($code -ne 0) { throw "Godot export failed with exit code $code" }
          if (-not (Test-Path build/windows/teste.exe)) { throw 'Export did not produce build/windows/teste.exe' }
          $scriptErrors = Select-String -Path export.log -Pattern 'SCRIPT ERROR: Parse Error|Failed to load script'
          if ($scriptErrors) { throw "Script errors during export:`n$($scriptErrors | Out-String)" }

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "sandbox-project-${{ needs.version.outputs.version }}-windows-x86_64"
          $stage = "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/windows/* $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: ${{ needs.version.outputs.skip != 'true' && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*/*.zip)
          if [ ${#assets[@]} -eq 0 ]; then
            echo 'No build assets were downloaded.' >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
